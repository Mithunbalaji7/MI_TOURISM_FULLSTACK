<!DOCTYPE html>
<html lang="en">
<head>
<title>My Profile - MI Tourism Development</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/common.css">
<style>
.header { padding: 40px; text-align: center; background: #1abc9c; color: white; }
.navbar { overflow: hidden; background-color: #333; }
.navbar a { float: left; display: block; color: white; text-align: center; padding: 14px 20px; text-decoration: none; }
.navbar a.right { float: right; }
.navbar a:hover { background-color: #ddd; color: black; }
#profilePicPreview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 10px; }
</style>
</head>
<body>

<div class="header"><h1 style="font-family:arial black">MI TOURISM DEVELOPMENT</h1></div>
<div class="navbar">
  <a href="HOME.html">HOME</a>
  <a href="search.html">HOTELS</a>
  <a href="search.html">TOUR PACKAGES</a>
  <a href="gallery.html">EVENT PLACES</a>
  <a href="blog.html">WHAT'S OTHERS</a>
  <a href="login.html" class="right">LOGIN/SIGNUP</a>
</div>
<div class="util-bar">
  <a href="HOME.html">Home</a>
  <a href="dashboard.html" class="right">Dashboard</a>
</div>

<div class="page-wrap">
  <div class="card">
    <img id="profilePicPreview" src="assets/img/user1.jpg">
    <h2 style="text-align:center;color:#1abc9c;">Edit Profile</h2>
    <div id="alertBox1" class="alert" style="display:none;"></div>
    <form class="form-box" id="profileForm">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" required>
      <label for="phone">Phone</label>
      <input type="text" id="phone" pattern="[0-9]{10}">
      <label for="profile_picture">Profile Picture URL</label>
      <select id="profile_picture">
        <option value="assets/img/user1.jpg">Avatar 1</option>
        <option value="assets/img/user2.jpg">Avatar 2</option>
        <option value="assets/img/user3.jpg">Avatar 3</option>
        <option value="assets/img/user4.jpg">Avatar 4</option>
      </select>
      <button class="btn" type="submit">Save Changes</button>
    </form>
  </div>

  <div class="card">
    <h2 style="text-align:center;color:#1abc9c;">Change Password</h2>
    <div id="alertBox2" class="alert" style="display:none;"></div>
    <form class="form-box" id="passwordForm">
      <label for="current_password">Current Password</label>
      <input type="password" id="current_password" required>
      <label for="new_password">New Password</label>
      <input type="password" id="new_password" required minlength="6">
      <button class="btn" type="submit">Change Password</button>
    </form>
  </div>
</div>

<footer class="site-footer">&copy; MI Tourism Development</footer>

<script src="assets/js/api.js"></script>
<script>
requireLogin();

async function loadProfile() {
  const res = await apiRequest("/dashboard");
  if (!res.ok) return;
  const user = res.data.user;
  document.getElementById("full_name").value = user.full_name;
  document.getElementById("phone").value = user.phone || "";
  document.getElementById("profile_picture").value = user.profile_picture || "assets/img/user1.jpg";
  document.getElementById("profilePicPreview").src = user.profile_picture || "assets/img/user1.jpg";
}

document.getElementById("profile_picture").addEventListener("change", function () {
  document.getElementById("profilePicPreview").src = this.value;
});

document.getElementById("profileForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const body = {
    full_name: document.getElementById("full_name").value,
    phone: document.getElementById("phone").value,
    profile_picture: document.getElementById("profile_picture").value,
  };
  const res = await apiRequest("/profile", { method: "PUT", body });
  showAlert("alertBox1", res.data.message, res.ok ? "success" : "error");
  if (res.ok) {
    const user = Auth.getUser();
    user.full_name = body.full_name;
    Auth.setUser(user);
  }
});

document.getElementById("passwordForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const body = {
    current_password: document.getElementById("current_password").value,
    new_password: document.getElementById("new_password").value,
  };
  const res = await apiRequest("/profile/change-password", { method: "POST", body });
  showAlert("alertBox2", res.data.message, res.ok ? "success" : "error");
  if (res.ok) e.target.reset();
});

loadProfile();
</script>
</body>
</html>
