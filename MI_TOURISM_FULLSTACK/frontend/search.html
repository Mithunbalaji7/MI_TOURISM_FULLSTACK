<!DOCTYPE html>
<html lang="en">
<head>
<title>Search Places - MI Tourism Development</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/common.css">
<style>
.header { padding: 40px; text-align: center; background: #1abc9c; color: white; }
.navbar { overflow: hidden; background-color: #333; }
.navbar a { float: left; display: block; color: white; text-align: center; padding: 14px 20px; text-decoration: none; }
.navbar a.right { float: right; }
.navbar a:hover { background-color: #ddd; color: black; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.filters input, .filters select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
</style>
</head>
<body>

<div class="header"><h1 style="font-family:arial black">MI TOURISM DEVELOPMENT</h1></div>
<div class="navbar">

<a href="HOME.html">HOME</a>

<a href="hotels.html">HOTELS</a>

<a href="packages.html">TOUR PACKAGES</a>

<a href="events.html">EVENT PLACES</a>

<a href="others.html">WHAT'S OTHERS</a>

<a href="search.html">SEARCH</a>

<a href="booking.html">BOOK TOUR</a>

<a href="gallery.html">GALLERY</a>

<a href="blog.html">BLOG</a>

<a href="news.html">NEWS</a>

<a href="contact.html">CONTACT</a>

<a href="dashboard.html">DASHBOARD</a>

<a href="login.html" class="right">LOGIN</a>

</div>
<div class="page-wrap">
  <h2 style="color:#1abc9c;">Search Tourist Places</h2>
  <div class="filters card">
    <input type="text" id="q" placeholder="Search by name or description...">
    <select id="district"><option value="">All Districts</option></select>
    <select id="category">
      <option value="">All Categories</option>
      <option>Hill Station</option><option>Spiritual</option><option>Beach</option>
      <option>Heritage</option><option>Wildlife</option><option>Regular</option>
    </select>
    <select id="min_rating">
      <option value="">Any Rating</option>
      <option value="4">4★ & up</option><option value="3">3★ & up</option><option value="2">2★ & up</option>
    </select>
    <input type="number" id="max_budget" placeholder="Max budget (₹)">
    <button class="btn" onclick="runSearch()">Search</button>
  </div>

  <div class="grid" id="resultsGrid"></div>
</div>

<footer class="site-footer">&copy; MI Tourism Development</footer>

<script src="assets/js/api.js"></script>
<script>
async function loadDistricts() {
  const res = await apiRequest("/places");
  if (!res.ok) return;
  const districts = [...new Set(res.data.places.map(p => p.district))];
  const sel = document.getElementById("district");
  districts.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d; opt.textContent = d;
    sel.appendChild(opt);
  });
}

async function runSearch() {
  const q = document.getElementById("q").value.trim();
  const district = document.getElementById("district").value;
  const category = document.getElementById("category").value;
  const min_rating = document.getElementById("min_rating").value;
  const max_budget = document.getElementById("max_budget").value;

  const params = new URLSearchParams();
  if (q) params.set("q", q);
  if (district) params.set("district", district);
  if (category) params.set("category", category);
  if (min_rating) params.set("min_rating", min_rating);
  if (max_budget) params.set("max_budget", max_budget);

  const res = await apiRequest("/search?" + params.toString());
  const grid = document.getElementById("resultsGrid");
  if (!res.ok) { grid.innerHTML = "<p>Search failed.</p>"; return; }

  grid.innerHTML = res.data.results.map(p => `
    <div class="card place-card">
      <img src="${p.image_url || 'assets/img/picture1.jpg'}" alt="${p.name}">
      <h4>${p.name}</h4>
      <p>${p.district} • ${p.category}</p>
      <p class="stars">${starString(p.rating)} (${p.rating})</p>
      ${p.from_price ? `<p>From ₹${p.from_price}</p>` : ""}
      <a class="btn" href="booking.html?place_id=${p.id}">View Packages</a>
    </div>`).join("") || "<p>No places matched your search.</p>";
}

loadDistricts();
runSearch();
</script>
</body>
</html>
