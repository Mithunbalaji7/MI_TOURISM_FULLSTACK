<style>
.header { padding: 40px; text-align: center; background: #1abc9c; color: white; }
.navbar { overflow: hidden; background-color: #333; }
.navbar a { float: left; display: block; color: white; text-align: center; padding: 14px 20px; text-decoration: none; }
.navbar a.right { float: right; }

</style>
</head>
<body>

<div class="navbar">

<a href="HOME.html">HOME</a>

<a href="hotels.html">HOTELS</a>

<a href="dashboard.html">DASHBOARD</a>

<a href="login.html" class="right">LOGIN</a>

</div>

<div class="page-wrap">
  <div class="card">
    <h2 style="text-align:center;color:#1abc9c;">Contact Us</h2>
    <div id="alertBox" class="alert" style="display:none;"></div>
    <form class="form-box" id="contactForm">
      <label for="name">Name</label>
      <input type="text" id="name" required>
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="phone">Phone</label>
      <input type="text" id="phone" pattern="[0-9]{10}">
      <label for="message">Message</label>
      <textarea id="message" rows="5" required></textarea>
      <button type="submit" class="btn">Send Message</button>
    </form>
  </div>
</div>

<footer class="site-footer">&copy; MI Tourism Development</footer>

<script src="assets/js/api.js"></script>
<script>
document.getElementById("contactForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const body = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    message: document.getElementById("message").value.trim(),
  };
  const res = await apiRequest("/contact", { method: "POST", body });
  showAlert("alertBox", res.data.message, res.ok ? "success" : "error");
  if (res.ok) document.getElementById("contactForm").reset();
});
</script>
</body>
</html>
