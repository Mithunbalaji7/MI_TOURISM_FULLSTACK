<!DOCTYPE html>
<html lang="en">
<head>
<title>Feedback - MI Tourism Development</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/common.css">
<style>
.header { padding: 40px; text-align: center; background: #1abc9c; color: white; }
.navbar { overflow: hidden; background-color: #333; }
.navbar a { float: left; display: block; color: white; text-align: center; padding: 14px 20px; text-decoration: none; }
.navbar a.right { float: right; }
.navbar a:hover { background-color: #ddd; color: black; }
</style>
</head>
<body>

<div class="navbar">

<a href="HOME.html">HOME</a>

<a href="hotels.html">HOTELS</a>

<a href="packages.html">TOUR PACKAGES</a>

<a href="events.html">EVENT PLACES</a>

<a href="others.html">WHAT'S OTHERS</a>

<a href="search.html">SEARCH</a>

<a href="booking.html">BOOK TOUR</a>

<a href="gallery.html">GALLERY</a>

<a href="blog.html">BLOG</a>

<a href="news.html">NEWS</a>

<a href="contact.html">CONTACT</a>

<a href="dashboard.html">DASHBOARD</a>

<a href="login.html" class="right">LOGIN</a>

</div>

<div class="page-wrap">
  <div class="card">
    <h2 style="color:#1abc9c;">Give Feedback</h2>
    <div id="alertBox" class="alert" style="display:none;"></div>
    <form class="form-box" id="feedbackForm">
      <label for="place_id">Place</label>
      <select id="place_id" required></select>
      <label for="rating">Rating</label>
      <select id="rating" required>
        <option value="5">5 - Excellent</option>
        <option value="4">4 - Very Good</option>
        <option value="3">3 - Good</option>
        <option value="2">2 - Fair</option>
        <option value="1">1 - Poor</option>
      </select>
      <label for="review_text">Review</label>
      <textarea id="review_text" rows="4"></textarea>
      <button class="btn" type="submit">Submit Review</button>
    </form>
  </div>

  <h3>Recent Reviews</h3>
  <div id="reviewsList"></div>
</div>

<footer class="site-footer">&copy; MI Tourism Development</footer>

<script src="assets/js/api.js"></script>
<script>
async function loadPlacesDropdown() {
  const res = await apiRequest("/places");
  if (!res.ok) return;
  document.getElementById("place_id").innerHTML = res.data.places.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
}

async function loadReviews() {
  const res = await apiRequest("/reviews");
  if (!res.ok) return;
  document.getElementById("reviewsList").innerHTML = res.data.reviews.map(r => `
    <div class="card">
      <b>${r.full_name}</b> on <i>${r.place_name || "a place"}</i>
      <p class="stars">${starString(r.rating)}</p>
      <p>${r.review_text || ""}</p>
      <small>${formatDate(r.created_at)}</small>
    </div>`).join("") || "<p>No reviews yet.</p>";
}

document.getElementById("feedbackForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  if (!Auth.isLoggedIn()) { window.location.href = "login.html"; return; }
  const body = {
    place_id: document.getElementById("place_id").value,
    rating: document.getElementById("rating").value,
    review_text: document.getElementById("review_text").value,
  };
  const res = await apiRequest("/reviews", { method: "POST", body });
  showAlert("alertBox", res.data.message, res.ok ? "success" : "error");
  if (res.ok) { e.target.reset(); loadReviews(); }
});

loadPlacesDropdown();
loadReviews();
</script>
</body>
</html>
