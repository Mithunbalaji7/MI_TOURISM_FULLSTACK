<!DOCTYPE html>
<html lang="en">
<head>
<title>My Dashboard - MI Tourism Development</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/common.css">
<style>
.header { padding: 40px; text-align: center; background: #1abc9c; color: white; }
.navbar { overflow: hidden; background-color: #333; }
.navbar a { float: left; display: block; color: white; text-align: center; padding: 14px 20px; text-decoration: none; }
.navbar a.right { float: right; }
.navbar a:hover { background-color: #ddd; color: black; }
</style>
</head>
<body>

<div class="navbar">

<a href="HOME.html">HOME</a>
<a href="hotels.html">HOTELS</a>
<a href="packages.html">TOUR PACKAGES</a>
<a href="events.html">EVENT PLACES</a>
<a href="others.html">WHAT'S OTHERS</a>
<a href="search.html">SEARCH</a>
<a href="booking.html">BOOK TOUR</a>
<a href="gallery.html">GALLERY</a>
<a href="blog.html">BLOG</a>
<a href="news.html">NEWS</a>
<a href="contact.html">CONTACT</a>
<a href="dashboard.html">DASHBOARD</a>
<a href="login.html" class="right">LOGIN</a>

</div>

<div class="page-wrap">
  <h2 style="color:#1abc9c;">Welcome, <span id="userName">Traveller</span></h2>

  <div class="stats-row" id="userSummary"></div>

  <div class="tabs">
    <button class="active" onclick="showTab('bookings')">Booking History</button>
    <button onclick="showTab('favourites')">Favourite Places</button>
    <button onclick="showTab('searches')">Recent Searches</button>
    <button onclick="showTab('notifications')">Notifications</button>
  </div>

  <div id="tab-bookings" class="tab-content card">
    <h3>My Bookings</h3>
    <table class="data-table" id="bookingsTable">
      <thead><tr><th>Code</th><th>Package</th><th>Date</th><th>Members</th><th>Total (₹)</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="tab-favourites" class="tab-content card" style="display:none;">
    <h3>Favourite Places</h3>
    <div class="grid" id="favouritesGrid"></div>
  </div>

  <div id="tab-searches" class="tab-content card" style="display:none;">
    <h3>Recent Searches</h3>
    <ul id="searchesList"></ul>
  </div>

  <div id="tab-notifications" class="tab-content card" style="display:none;">
    <h3>Notifications</h3>
    <ul id="notificationsList"></ul>
  </div>
</div>

<footer class="site-footer">&copy; MI Tourism Development</footer>

<script src="assets/js/api.js"></script>
<script>
requireLogin();

function showTab(name) {
  document.querySelectorAll(".tab-content").forEach(el => (el.style.display = "none"));
  document.getElementById("tab-" + name).style.display = "block";
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
}

async function loadDashboard() {
  const res = await apiRequest("/dashboard");
  if (!res.ok) {
    if (res.status === 401) Auth.logout();
    return;
  }
  const { user, booking_history, favourite_places, recent_searches } = res.data;
  document.getElementById("userName").textContent = user.full_name;

  document.getElementById("userSummary").innerHTML = `
    <div class="stat-box"><span class="stat-number">${booking_history.length}</span><span class="stat-label">Bookings</span></div>
    <div class="stat-box"><span class="stat-number">${favourite_places.length}</span><span class="stat-label">Favourites</span></div>
    <div class="stat-box"><span class="stat-number">${recent_searches.length}</span><span class="stat-label">Recent Searches</span></div>
  `;

  const tbody = document.querySelector("#bookingsTable tbody");
  tbody.innerHTML = booking_history.map(b => `
    <tr>
      <td>${b.booking_code}</td>
      <td>${b.package_title}</td>
      <td>${formatDate(b.travel_date)}</td>
      <td>${b.members}</td>
      <td>${b.total_amount}</td>
      <td><span class="badge ${b.status}">${b.status}</span></td>
    </tr>`).join("") || "<tr><td colspan='6'>No bookings yet. <a href='search.html'>Browse packages</a></td></tr>";

  document.getElementById("favouritesGrid").innerHTML = favourite_places.map(p => `
    <div class="card place-card">
      <img src="${p.image_url || 'assets/img/picture1.jpg'}" alt="${p.name}">
      <h4>${p.name}</h4>
      <p>${p.district} • ${p.category}</p>
    </div>`).join("") || "<p>No favourites yet.</p>";

  document.getElementById("searchesList").innerHTML = recent_searches.map(s => `
    <li>"${s.search_term}" - ${formatDate(s.searched_at)}</li>`).join("") || "<li>No recent searches.</li>";

  const notifRes = await apiRequest("/notifications");
  if (notifRes.ok) {
    document.getElementById("notificationsList").innerHTML = notifRes.data.notifications.map(n => `
      <li><b>${n.title}</b> - ${n.message} <small>(${formatDate(n.created_at)})</small></li>`).join("") || "<li>No notifications.</li>";
  }
}

document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); Auth.logout(); });
loadDashboard();
</script>
</body>
</html>
