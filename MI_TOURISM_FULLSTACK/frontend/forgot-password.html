<!DOCTYPE html>
<html lang="en">
<head>
<title>Forgot Password - MI Tourism Development</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/common.css">
<style>
.header { padding: 40px; text-align: center; background: #1abc9c; color: white; }
.navbar { overflow: hidden; background-color: #333; }
.navbar a { float: left; display: block; color: white; text-align: center; padding: 14px 20px; text-decoration: none; }
.navbar a.right { float: right; }
.navbar a:hover { background-color: #ddd; color: black; }
</style>
</head>
<body>

<div class="header"><h1 style="font-family:arial black">MI TOURISM DEVELOPMENT</h1></div>
<div class="navbar">
  <a href="HOME.html">HOME</a>
  <a href="search.html">HOTELS</a>
  <a href="search.html">TOUR PACKAGES</a>
  <a href="gallery.html">EVENT PLACES</a>
  <a href="blog.html">WHAT'S OTHERS</a>
  <a href="login.html" class="right">LOGIN/SIGNUP</a>
</div>
<div class="util-bar">
  <a href="HOME.html">Home</a>
  <a href="login.html" class="right">Login</a>
</div>

<div class="page-wrap">
  <div class="card">
    <h2 style="text-align:center;color:#1abc9c;">Forgot Password</h2>
    <div id="alertBox" class="alert" style="display:none;"></div>

    <div id="stepEmail">
      <form class="form-box" id="emailForm">
        <label for="email">Registered Email</label>
        <input type="email" id="email" required>
        <button type="submit" class="btn">Send OTP</button>
      </form>
    </div>

    <div id="stepReset" style="display:none;">
      <form class="form-box" id="resetForm">
        <label for="otp">OTP (dummy - shown on screen since there's no real email server)</label>
        <input type="text" id="otp" required>
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" required minlength="6">
        <button type="submit" class="btn">Reset Password</button>
      </form>
    </div>
  </div>
</div>

<footer class="site-footer">&copy; MI Tourism Development <br>Developed by Mithun Balaji R M.<br>
This is a personal tourism webdevelopment demo project created for learning and portfolio showcase purposes only.</footer>

<script src="assets/js/api.js"></script>
<script>
let savedEmail = "";
document.getElementById("emailForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  savedEmail = document.getElementById("email").value.trim();
  const res = await apiRequest("/auth/forgot-password", { method: "POST", body: { email: savedEmail } });
  if (!res.ok) {
    showAlert("alertBox", res.data.message || "Could not send OTP.", "error");
    return;
  }
  showAlert("alertBox", `OTP generated (dummy): ${res.data.dummy_otp} - enter it below.`, "success");
  document.getElementById("stepReset").style.display = "block";
});

document.getElementById("resetForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const otp = document.getElementById("otp").value.trim();
  const new_password = document.getElementById("new_password").value;
  const res = await apiRequest("/auth/reset-password", {
    method: "POST",
    body: { email: savedEmail, otp, new_password },
  });
  if (!res.ok) {
    showAlert("alertBox", res.data.message || "Reset failed.", "error");
    return;
  }
  showAlert("alertBox", "Password reset! Redirecting to login...", "success");
  setTimeout(() => (window.location.href = "login.html"), 900);
});
</script>
</body>
</html>
